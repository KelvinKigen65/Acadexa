services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: acadexa
      POSTGRES_USER: acadexa
      POSTGRES_PASSWORD: acadexa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadexa -d acadexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: local-development-only-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://acadexa:acadexa@db:5432/acadexa
      EMBEDDING_BACKEND: local_hash
      LLM_BACKEND: none
    command: >
      sh -c "python manage.py migrate &&
      gunicorn acadexa.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
